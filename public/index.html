<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cortex — the agentic drive</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><path d='M9 16a7 7 0 0 1 12-5M23 16a7 7 0 0 1-12 5' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round'/><circle cx='16' cy='16' r='2.6' fill='white'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M9 16a7 7 0 0 1 12-5M23 16a7 7 0 0 1-12 5" stroke="white" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="16" cy="16" r="2.6" fill="white"/></svg>
      </span>
      <div>
        <div class="brand-name">Cortex</div>
        <div class="brand-sub">the agentic drive</div>
      </div>
    </div>
    <div class="topbar-right">
      <span id="busy" class="busy" hidden><span class="spinner"></span><span id="busyLabel">Working…</span></span>
      <span id="mode" class="mode-pill" title="Which brain the agents are using"></span>
      <button id="themeBtn" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode">◐</button>
      <button id="resetBtn" class="ghost-btn" title="Wipe the drive and reload the demo files">Reset demo</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" aria-label="Drive navigation">
      <label class="upload-btn">
        <input id="fileInput" type="file" multiple hidden />
        <span>＋</span> Upload files
      </label>

      <div class="nav">
        <button class="nav-item active" data-view="files"><span class="ni">▦</span> All files <span class="count" id="countFiles"></span></button>
        <button class="nav-item" data-view="insights"><span class="ni">✦</span> Insights <span class="badge" id="countInsights"></span></button>
        <button class="nav-item" data-view="automations"><span class="ni">⚡</span> Automations <span class="count" id="countWf"></span></button>
        <button class="nav-item" data-view="activity"><span class="ni">◷</span> Agent activity</button>
      </div>

      <div class="section-head">
        <span>Smart folders</span>
        <button id="reorgBtn" class="tiny-btn" title="Ask the Organizer to rebuild the folder structure">↻ Reorganize</button>
      </div>
      <div id="folders" class="folders"></div>
      <p class="sidebar-note">Folders are generated by the Organizer agent from file contents — you never create them.</p>
    </nav>

    <main class="main">
      <form id="commandForm" class="command" autocomplete="off">
        <span class="command-icon" aria-hidden="true">✦</span>
        <input id="commandInput" type="text" placeholder="Ask anything, draft a document, or describe an automation…" aria-label="Command" />
        <button type="submit" class="command-go" aria-label="Run">↵</button>
      </form>
      <div id="chips" class="chips"></div>

      <div id="selectionBar" class="selection-bar" hidden>
        <span id="selCount"></span>
        <input id="selInstruction" type="text" placeholder="e.g. Draft a unified project requirements doc from these" />
        <button id="selSynth" class="primary-btn">✎ Synthesize</button>
        <button id="selAsk" class="ghost-btn">Ask about these</button>
        <button id="selClear" class="icon-btn" aria-label="Clear selection">✕</button>
      </div>

      <section id="view"></section>
    </main>

    <aside id="panel" class="panel" aria-live="polite" hidden>
      <div class="panel-head">
        <span id="panelTitle" class="panel-title"></span>
        <button id="panelClose" class="icon-btn" aria-label="Close panel">✕</button>
      </div>
      <div id="panelBody" class="panel-body"></div>
    </aside>
  </div>

  <div id="dropzone" class="dropzone" hidden>
    <div class="dropzone-inner">
      <div class="dz-icon">⇪</div>
      <div class="dz-title">Drop to hand these to your agents</div>
      <div class="dz-sub">The Librarian reads them, the Organizer files them, the Sentinel cross-checks them.</div>
    </div>
  </div>
  <div id="toasts" class="toasts"></div>

  <script src="app.js" type="module"></script>
</body>
</html>
